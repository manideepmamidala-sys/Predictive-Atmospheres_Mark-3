# Candidate API deployment only. See docs/operations.md and docs/release-readiness.md.
services:
  - type: web
    name: predictive-atmospheres-api
    runtime: python
    plan: free
    autoDeployTrigger: "off"
    buildCommand: pip install uv==0.5.9 && cd backend && uv sync --frozen --no-dev
    startCommand: cd backend && uv run --frozen --no-dev uvicorn pa.api.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: PA_CORS_ORIGINS
        sync: false
