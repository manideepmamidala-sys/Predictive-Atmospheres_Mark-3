services:
  # FastAPI Backend
  - type: web
    name: predictive-atmospheres-api
    env: docker
    dockerfilePath: ./Dockerfile.api
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8000

  # Streamlit Frontend
  - type: web
    name: predictive-atmospheres-frontend
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: API_URL
        fromService:
          type: web
          name: predictive-atmospheres-api
          envVarKey: RENDER_EXTERNAL_URL
