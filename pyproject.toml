[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "predictive-atmospheres"
version = "0.2.0"
description = "EEG-based Emotion Recognition System mapped to Spatial Architectures"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
dependencies = [
    "streamlit>=1.31.0",
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "plotly>=5.18.0",
    "torch>=2.1.0",
    "scikit-learn>=1.3.0",
    "pydantic>=2.8.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "requests>=2.31.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "flake8>=6.1.0",
    "mypy>=1.11.0"
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "frontend*"]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:Using padding='same' with even kernel lengths and odd dilation may require a zero-padded copy of the input be created:UserWarning"
]
