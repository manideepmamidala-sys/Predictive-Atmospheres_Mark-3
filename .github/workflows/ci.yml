name: Research platform CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  reproduce-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      CI: "true"
      # Approved CP-B signal bytes reproduce with X86_V3 and Haswell kernels.
      # Hosted runners can expose AVX-512 and otherwise change floating-point results.
      NPY_DISABLE_CPU_FEATURES: "X86_V4,AVX512_ICL,AVX512_SPR"
      OPENBLAS_CORETYPE: "Haswell"
    steps:
      - uses: actions/checkout@v6

      - name: Set up uv and Python
        # setup-uv v9.0.0; the upstream repository does not publish a v9 ref.
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.5.9"
          python-version: "3.11.11"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22.22.1"

      - name: Enable pinned pnpm
        run: corepack enable

      - name: Install frozen project dependencies
        run: make setup

      - name: Verify approved numerical runtime
        run: |
          cd backend
          uv run --frozen python - <<'PY'
          import numpy as np
          from scipy import linalg
          from threadpoolctl import threadpool_info

          features = np._core._multiarray_umath.__cpu_features__
          selected = {name: features.get(name) for name in
                      ("X86_V3", "X86_V4", "AVX512_ICL", "AVX512_SPR")}
          blas = [row for row in threadpool_info() if row["internal_api"] == "openblas"]
          print("NumPy CPU features:", selected)
          print("OpenBLAS kernels:", [row["architecture"] for row in blas])
          if not selected["X86_V3"] or any(selected[name] for name in
                                           ("X86_V4", "AVX512_ICL", "AVX512_SPR")):
              raise SystemExit("NumPy CPU dispatch differs from approved CP-B runtime")
          if not blas or any(row["architecture"] != "Haswell" for row in blas):
              raise SystemExit("OpenBLAS kernel differs from approved CP-B runtime")
          PY

      - name: Install Chromium and host libraries
        run: cd frontend && corepack pnpm exec playwright install --with-deps chromium

      - name: Preserve committed research artifacts
        run: |
          mkdir -p "$RUNNER_TEMP/committed-artifacts/artifacts"
          cp -a artifacts/results artifacts/model "$RUNNER_TEMP/committed-artifacts/artifacts/"

      - name: Verify source and regenerate research products
        id: pipeline
        run: make pipeline

      - name: Diagnose CP-B source drift
        if: failure() && steps.pipeline.outcome == 'failure'
        run: |
          mkdir -p "$RUNNER_TEMP/cp-b-failure-evidence/approved" "$RUNNER_TEMP/cp-b-failure-evidence/regenerated"
          cp "$RUNNER_TEMP/committed-artifacts/artifacts/results/"{signals_detail,timebase,qc_review}.json "$RUNNER_TEMP/cp-b-failure-evidence/approved/"
          cp artifacts/results/{signals_detail,timebase,qc_review}.json "$RUNNER_TEMP/cp-b-failure-evidence/regenerated/"
          cd backend
          uv run --frozen python ../scripts/diagnose_cp_b_drift.py "$RUNNER_TEMP/committed-artifacts" ..

      - name: Upload CP-B failure evidence
        if: failure() && steps.pipeline.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: cp-b-failure-evidence
          retention-days: 7
          path: ${{ runner.temp }}/cp-b-failure-evidence/

      - name: Check regenerated research artifacts for drift
        run: python3 scripts/compare_reproduction.py "$RUNNER_TEMP/committed-artifacts" .

      - name: Check source, contract, and browser behavior
        run: make lint test site
