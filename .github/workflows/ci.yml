name: Research platform CI

on:
  push:
  pull_request:

jobs:
  reproduce-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v6

      - name: Set up uv and Python
        # setup-uv v9.0.0; the upstream repository does not publish a v9 ref.
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.5.9"
          python-version: "3.11.11"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22.22.1"

      - name: Enable pinned pnpm
        run: corepack enable

      - name: Install frozen project dependencies
        run: make setup

      - name: Install Chromium and host libraries
        run: cd frontend && corepack pnpm exec playwright install --with-deps chromium

      - name: Verify source and regenerate research products
        run: make pipeline

      - name: Check source, contract, and browser behavior
        run: make lint test site
