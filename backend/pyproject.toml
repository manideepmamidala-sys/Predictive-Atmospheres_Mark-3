[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "predictive-atmospheres-research"
version = "1.0.0a1"
description = "Reproducible research processing and experimental room inference"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "scipy>=1.14,<2",
  "scikit-learn>=1.5,<2",
  "pydantic>=2.9,<3",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pyarrow>=17,<25",
  "PyYAML>=6,<7",
  "joblib>=1.4,<2",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "httpx>=0.27,<1",
    "ruff>=0.7,<1",
    "matplotlib>=3.9,<4",
]

[project.scripts]
pa = "pa.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/pa"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
